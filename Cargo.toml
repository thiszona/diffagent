[package]
name = "diffagent"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A GitHub App that reviews pull requests, answers questions in its review threads, and learns per-repository rules from maintainer corrections"
license = "Apache-2.0"
repository = "https://github.com/thiszona/diffagent"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[dependencies]
async-trait = "0.1"
aws-config = "1.13"
aws-sdk-bedrockruntime = { version = "1.152", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
blake2 = "0.11"
hmac = "0.13"
hyper-util = { version = "0.1.21", features = ["http1", "server", "service", "tokio"] }
ipnet = "2.12"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "time",
    "macros",
] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1", features = [
    "fs",
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "process",
    "io-util",
    "sync",
    "net",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
tree-sitter = "0.27"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.24.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.25.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.13"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
postgresql_embedded = { version = "0.22.0", default-features = false, features = [
    "tokio",
    "theseus",
    "tls-rustls-ring",
] }
tokio = { version = "1", features = ["test-util"] }
